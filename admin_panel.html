<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ-панель - {{ domain }}</title>
    <style>
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0f0f23 0%, #1a1a2e 50%, #16213e 100%);
            min-height: 100vh;
            padding: 20px;
            color: #fff;
            position: relative;
            overflow-x: hidden;
        }
        
        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(0,245,255,0.1) 0%, transparent 50%);
            animation: rotate 20s linear infinite;
            pointer-events: none;
        }
        
        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
        .container {
            max-width: 1600px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }
        
        h1 {
            font-size: 42px;
            font-weight: 700;
            background: linear-gradient(135deg, #00f5ff 0%, #ff00ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
            text-shadow: 0 0 30px rgba(0,245,255,0.3);
        }
        
        .subtitle {
            color: rgba(255,255,255,0.5);
            font-size: 16px;
            margin-bottom: 40px;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        
        .stat-card {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 30px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        
        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, #00f5ff, #ff00ff);
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        
        .stat-card:hover {
            transform: translateY(-5px);
            border-color: rgba(0,245,255,0.3);
            box-shadow: 0 12px 40px rgba(0,245,255,0.2);
        }
        
        .stat-card:hover::before {
            opacity: 1;
        }
        
        .stat-card h3 {
            color: rgba(255,255,255,0.6);
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .stat-card .value {
            font-size: 48px;
            font-weight: 700;
            background: linear-gradient(135deg, #00f5ff 0%, #00ff88 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .urls-section {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 30px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            overflow-x: auto;
        }
        
        .table-wrapper {
            overflow-x: visible;
        }
        
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }
        
        .urls-section h2 {
            font-size: 28px;
            font-weight: 600;
        }
        
        .action-buttons {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        
        .refresh-btn {
            background: linear-gradient(135deg, #00f5ff 0%, #00ff88 100%);
            color: #0f0f23;
            border: none;
            padding: 12px 28px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,245,255,0.3);
        }
        
        .refresh-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,245,255,0.5);
        }
        
        .delete-all-btn {
            background: linear-gradient(135deg, #ff416c 0%, #ff4b2b 100%);
            color: white;
            border: none;
            padding: 12px 28px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(255,65,108,0.3);
        }
        
        .delete-all-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255,65,108,0.5);
        }
        
        .delete-zero-btn {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            border: none;
            padding: 12px 28px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(240,147,251,0.3);
        }
        
        .delete-zero-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(240,147,251,0.5);
        }
        
        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0 10px;
            min-width: 900px;
        }
        
        thead tr {
            background: rgba(0,245,255,0.1);
        }
        
        th {
            padding: 16px;
            text-align: left;
            font-weight: 600;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: rgba(255,255,255,0.7);
            border: none;
        }
        
        th:first-child {
            border-radius: 12px 0 0 12px;
        }
        
        th:last-child {
            border-radius: 0 12px 12px 0;
        }
        
        tbody tr {
            background: rgba(255,255,255,0.03);
            transition: all 0.3s ease;
        }
        
        tbody tr:hover {
            background: rgba(0,245,255,0.08);
            transform: scale(1.01);
        }
        
        td {
            padding: 20px 16px;
            border: none;
            color: rgba(255,255,255,0.9);
        }
        
        tbody tr td:first-child {
            border-radius: 12px 0 0 12px;
        }
        
        tbody tr td:last-child {
            border-radius: 0 12px 12px 0;
        }
        
        .url-link {
            color: #00f5ff;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.2s ease;
        }
        
        .url-link:hover {
            color: #ff00ff;
            text-shadow: 0 0 10px rgba(0,245,255,0.5);
        }
        
        .original-url {
            color: rgba(255,255,255,0.5);
            font-size: 13px;
            max-width: 400px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        
        .clicks-badge {
            background: linear-gradient(135deg, #ff00ff 0%, #00f5ff 100%);
            color: white;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            display: inline-block;
            box-shadow: 0 4px 15px rgba(255,0,255,0.3);
        }
        
        .action-btns {
            display: flex;
            gap: 10px;
        }
        
        .btn {
            border: none;
            padding: 10px 18px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        
        .btn-logs {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(102,126,234,0.3);
        }
        
        .btn-logs:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102,126,234,0.5);
        }
        
        .btn-delete {
            background: linear-gradient(135deg, #ff416c 0%, #ff4b2b 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(255,65,108,0.3);
        }
        
        .btn-delete:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255,65,108,0.5);
        }
        
        .id-code {
            background: rgba(0,245,255,0.15);
            color: #00f5ff;
            padding: 8px 16px;
            border-radius: 10px;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            border: 1px solid rgba(0,245,255,0.3);
        }
        
        .id-code:hover {
            background: rgba(0,245,255,0.25);
            border-color: rgba(0,245,255,0.5);
            transform: scale(1.05);
        }
        
        .id-code:active {
            transform: scale(0.95);
        }
        
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        
        .modal-overlay.active {
            opacity: 1;
            pointer-events: all;
        }
        
        .modal-content {
            background: rgba(26,26,46,0.95);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border-radius: 24px;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            max-width: 90%;
            max-height: 90vh;
            overflow: hidden;
            transform: scale(0.9) translateY(20px);
            transition: transform 0.3s ease;
        }
        
        .modal-overlay.active .modal-content {
            transform: scale(1) translateY(0);
        }
        
        .modal-header {
            padding: 30px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(135deg, rgba(0,245,255,0.1) 0%, rgba(255,0,255,0.1) 100%);
        }
        
        .modal-header h3 {
            font-size: 24px;
            font-weight: 600;
            background: linear-gradient(135deg, #00f5ff 0%, #ff00ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .close-btn {
            background: rgba(255,255,255,0.1);
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 24px;
            color: rgba(255,255,255,0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }
        
        .close-btn:hover {
            background: rgba(255,65,108,0.3);
            color: #ff416c;
            transform: rotate(90deg);
        }
        
        .modal-body {
            padding: 30px;
            max-height: 70vh;
            overflow-y: auto;
        }
        
        .modal-body::-webkit-scrollbar {
            width: 8px;
        }
        
        .modal-body::-webkit-scrollbar-track {
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
        }
        
        .modal-body::-webkit-scrollbar-thumb {
            background: linear-gradient(135deg, #00f5ff 0%, #ff00ff 100%);
            border-radius: 10px;
        }
        
        .logs-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0 8px;
        }
        
        .logs-table th {
            background: rgba(0,245,255,0.1);
            padding: 12px;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: rgba(255,255,255,0.6);
        }
        
        .logs-table td {
            background: rgba(255,255,255,0.03);
            padding: 14px 12px;
            font-size: 13px;
            color: rgba(255,255,255,0.8);
        }
        
        .logs-table tr:hover td {
            background: rgba(0,245,255,0.08);
        }
        
        .device-mobile { 
            color: #ff416c; 
            font-weight: 600;
        }
        .device-desktop { 
            color: #00f5ff; 
            font-weight: 600;
        }
        .device-tablet { 
            color: #ff00ff; 
            font-weight: 600;
        }
        
        .time-badge {
            background: rgba(0,245,255,0.2);
            color: #00f5ff;
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
        }
        
        .no-logs {
            text-align: center;
            padding: 40px;
            color: rgba(255,255,255,0.4);
            font-size: 16px;
        }
        
        @keyframes slideIn {
            from {
                transform: translateX(400px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
        
        @keyframes slideOut {
            from {
                transform: translateX(0);
                opacity: 1;
            }
            to {
                transform: translateX(400px);
                opacity: 0;
            }
        }
        
        @media (max-width: 768px) {
            body {
                padding: 10px;
            }
            
            h1 {
                font-size: 28px;
            }
            
            .subtitle {
                font-size: 14px;
                margin-bottom: 20px;
            }
            
            .stats-grid {
                grid-template-columns: 1fr;
                gap: 15px;
                margin-bottom: 20px;
            }
            
            .stat-card {
                padding: 20px;
            }
            
            .stat-card .value {
                font-size: 36px;
            }
            
            .urls-section {
                padding: 15px;
            }
            
            .table-wrapper {
                overflow-x: auto;
                -webkit-overflow-scrolling: touch;
                margin: 0 -15px;
                padding: 0 15px;
            }
            
            table {
                font-size: 11px;
                min-width: 800px;
            }
            
            th, td {
                padding: 12px 8px;
                white-space: nowrap;
            }
            
            .original-url {
                max-width: 120px;
                font-size: 10px;
            }
            
            .url-link {
                font-size: 11px;
            }
            
            .action-btns {
                flex-direction: row;
                gap: 5px;
            }
            
            .btn {
                padding: 6px 10px;
                font-size: 10px;
                white-space: nowrap;
            }
            
            tbody tr:hover {
                transform: none;
            }
            
            .action-buttons {
                flex-direction: column;
                width: 100%;
            }
            
            .section-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }
            
            .section-header h2 {
                font-size: 22px;
            }
            
            .action-buttons button {
                width: 100%;
                font-size: 13px;
                padding: 10px 20px;
            }
            
            .id-code {
                font-size: 10px;
                padding: 4px 8px;
            }
            
            .clicks-badge {
                font-size: 11px;
                padding: 4px 10px;
            }
            
            .modal-content {
                max-width: 95%;
                margin: 10px;
            }
            
            .modal-header {
                padding: 20px;
            }
            
            .modal-body {
                padding: 15px;
            }
            
            .logs-table {
                font-size: 10px;
            }
            
            .logs-table th,
            .logs-table td {
                padding: 8px 6px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Админ-панель</h1>
        <p class="subtitle">{{ domain }} · URL Shortener</p>
        
        <div class="stats-grid">
            <div class="stat-card">
                <h3>Всего ссылок</h3>
                <div class="value" id="totalUrls">0</div>
            </div>
            <div class="stat-card">
                <h3>Всего переходов</h3>
                <div class="value" id="totalClicks">0</div>
            </div>
            <div class="stat-card">
                <h3>Уникальных IP</h3>
                <div class="value" id="uniqueIPs">0</div>
            </div>
            <div class="stat-card">
                <h3>Desktop</h3>
                <div class="value" id="desktopCount">0</div>
            </div>
            <div class="stat-card">
                <h3>Mobile</h3>
                <div class="value" id="mobileCount">0</div>
            </div>
        </div>
        
        <div class="urls-section">
            <div class="section-header">
                <h2>Все ссылки</h2>
                <div class="action-buttons">
                    <button class="refresh-btn" onclick="loadData()">Обновить</button>
                    <button class="delete-zero-btn" onclick="deleteZeroClicks()">Удалить ссылки с 0 переходов</button>
                    <button class="delete-all-btn" onclick="deleteAllLinks()">Удалить все ссылки</button>
                </div>
            </div>
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Короткая ссылка</th>
                            <th>Оригинальная ссылка</th>
                            <th>ID</th>
                            <th>Создана</th>
                            <th>Переходов</th>
                            <th>Действия</th>
                        </tr>
                    </thead>
                    <tbody id="urlsTableBody">
                        <tr><td colspan="6" style="text-align:center;padding:40px;color:rgba(255,255,255,0.4);">Ссылок пока нет</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-content" onclick="event.stopPropagation()">
            <div class="modal-header">
                <h3 id="modalTitle">Логи переходов</h3>
                <button class="close-btn" onclick="closeModal()">×</button>
            </div>
            <div class="modal-body" id="modalBody">
                Загрузка...
            </div>
        </div>
    </div>

    <script>
        let currentShortCode = null;
        
        async function loadData() {
            try {
                const [urlsResponse, statsResponse] = await Promise.all([
                    fetch('/api/urls'),
                    fetch('/api/admin/stats')
                ]);
                
                const urlsData = await urlsResponse.json();
                const statsData = await statsResponse.json();
                
                document.getElementById('totalUrls').textContent = statsData.total_urls;
                document.getElementById('totalClicks').textContent = statsData.total_clicks;
                document.getElementById('uniqueIPs').textContent = statsData.unique_ips;
                document.getElementById('desktopCount').textContent = statsData.desktop_count;
                document.getElementById('mobileCount').textContent = statsData.mobile_count;
                
                const tbody = document.getElementById('urlsTableBody');
                tbody.innerHTML = '';
                
                if (urlsData.urls.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;padding:40px;color:rgba(255,255,255,0.4);">Ссылок пока нет</td></tr>';
                    return;
                }
                
                urlsData.urls.forEach(url => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td><a href="/${url.short_code}" class="url-link" target="_blank">{{ domain }}/${url.short_code}</a></td>
                        <td><div class="original-url" title="${url.original_url}">${url.original_url}</div></td>
                        <td><span class="id-code" onclick="copyToClipboard('${url.short_code}')" title="Нажмите для копирования">${url.short_code}</span></td>
                        <td>${new Date(url.created_at).toLocaleString('ru-RU')}</td>
                        <td><span class="clicks-badge">${url.clicks}</span></td>
                        <td>
                            <div class="action-btns">
                                <button class="btn btn-logs" onclick="showLogs('${url.short_code}')">
                                    Логи
                                </button>
                                <button class="btn btn-delete" onclick="deleteLink('${url.short_code}')">
                                    Удалить
                                </button>
                            </div>
                        </td>
                    `;
                    tbody.appendChild(row);
                });
                
            } catch (error) {
                console.error('Ошибка загрузки данных:', error);
                document.getElementById('urlsTableBody').innerHTML = 
                    '<tr><td colspan="6" style="text-align:center;padding:40px;color:#ff416c;">Ошибка загрузки данных</td></tr>';
            }
        }
        
        async function showLogs(shortCode) {
            currentShortCode = shortCode;
            const modal = document.getElementById('modalOverlay');
            const modalBody = document.getElementById('modalBody');
            const modalTitle = document.getElementById('modalTitle');
            
            modalTitle.textContent = `Логи переходов: ${shortCode}`;
            modalBody.innerHTML = '<div style="text-align:center;padding:40px;color:rgba(255,255,255,0.5);">Загрузка...</div>';
            modal.classList.add('active');
            
            try {
                const response = await fetch(`/api/admin/logs/${shortCode}`);
                const data = await response.json();
                
                if (data.logs.length === 0) {
                    modalBody.innerHTML = '<div class="no-logs">Переходов по этой ссылке пока нет</div>';
                    return;
                }
                
                let html = '<table class="logs-table"><thead><tr>';
                html += '<th>Дата/Время</th><th>С момента создания</th><th>IP</th><th>Страна/Город</th>';
                html += '<th>Устройство</th><th>Браузер</th><th>ОС</th><th>Referer</th>';
                html += '</tr></thead><tbody>';
                
                data.logs.forEach(log => {
                    const deviceClass = 'device-' + log.device_type.toLowerCase();
                    const clickTime = new Date(log.clicked_at);
                    
                    html += `<tr>
                        <td>${clickTime.toLocaleString('ru-RU')}</td>
                        <td><span class="time-badge">${log.time_since_created}</span></td>
                        <td>${log.ip_address}</td>
                        <td>${log.country} / ${log.city}</td>
                        <td><span class="${deviceClass}">${log.device_type}</span></td>
                        <td>${log.browser}</td>
                        <td>${log.os}</td>
                        <td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="${log.referer}">${log.referer || '-'}</td>
                    </tr>`;
                });
                
                html += '</tbody></table>';
                modalBody.innerHTML = html;
                
            } catch (error) {
                console.error('Ошибка загрузки логов:', error);
                modalBody.innerHTML = '<div style="text-align:center;padding:40px;color:#ff416c;">Ошибка загрузки логов</div>';
            }
        }
        
        function closeModal() {
            document.getElementById('modalOverlay').classList.remove('active');
        }
        
        document.getElementById('modalOverlay').addEventListener('click', function(e) {
            if (e.target === this) {
                closeModal();
            }
        });
        
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeModal();
            }
        });
        
        async function deleteLink(shortCode) {
            if (!confirm(`Вы уверены, что хотите удалить ссылку ${shortCode}? Это действие нельзя отменить.`)) {
                return;
            }
            
            try {
                const response = await fetch(`/api/admin/delete/${shortCode}`, {
                    method: 'DELETE'
                });
                
                if (response.ok) {
                    await loadData();
                    showNotification('Ссылка успешно удалена', 'success');
                } else {
                    const data = await response.json();
                    showNotification(data.error || 'Ошибка удаления', 'error');
                }
            } catch (error) {
                console.error('Ошибка удаления:', error);
                showNotification('Ошибка удаления ссылки', 'error');
            }
        }
        
        async function deleteAllLinks() {
            if (!confirm('ВНИМАНИЕ! Вы уверены, что хотите удалить ВСЕ ссылки?\n\nЭто действие необратимо и удалит все созданные короткие ссылки и их логи!')) {
                return;
            }
            
            if (!confirm('Последнее предупреждение! Удалить все ссылки?')) {
                return;
            }
            
            try {
                const response = await fetch('/api/admin/delete-all-links', {
                    method: 'DELETE'
                });
                
                if (response.ok) {
                    const data = await response.json();
                    await loadData();
                    showNotification(`Успешно удалено: ${data.deleted_links} ссылок и ${data.deleted_logs} логов`, 'success');
                } else {
                    const data = await response.json();
                    showNotification(data.error || 'Ошибка удаления всех ссылок', 'error');
                }
            } catch (error) {
                console.error('Ошибка удаления всех ссылок:', error);
                showNotification('Ошибка удаления всех ссылок', 'error');
            }
        }
        
        async function deleteZeroClicks() {
            if (!confirm('Вы уверены, что хотите удалить все ссылки с 0 переходов?\n\nЭто действие нельзя отменить.')) {
                return;
            }
            
            try {
                const response = await fetch('/api/admin/delete-zero-clicks', {
                    method: 'DELETE'
                });
                
                if (response.ok) {
                    const data = await response.json();
                    await loadData();
                    if (data.deleted_links > 0) {
                        showNotification(`Успешно удалено ссылок: ${data.deleted_links}`, 'success');
                    } else {
                        showNotification('Ссылок с 0 переходов не найдено', 'success');
                    }
                } else {
                    const data = await response.json();
                    showNotification(data.error || 'Ошибка удаления ссылок', 'error');
                }
            } catch (error) {
                console.error('Ошибка удаления ссылок с 0 переходов:', error);
                showNotification('Ошибка удаления ссылок с 0 переходов', 'error');
            }
        }
        
        function copyToClipboard(text) {
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(text).then(() => {
                    showNotification(`ID скопирован: ${text}`, 'success');
                }).catch(err => {
                    console.error('Ошибка копирования:', err);
                    fallbackCopyToClipboard(text);
                });
            } else {
                fallbackCopyToClipboard(text);
            }
        }
        
        function fallbackCopyToClipboard(text) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed';
            textarea.style.left = '-999999px';
            textarea.style.top = '-999999px';
            document.body.appendChild(textarea);
            textarea.focus();
            textarea.select();
            try {
                const successful = document.execCommand('copy');
                if (successful) {
                    showNotification(`ID скопирован: ${text}`, 'success');
                } else {
                    showNotification('Не удалось скопировать', 'error');
                }
            } catch (err) {
                console.error('Ошибка копирования:', err);
                showNotification('Ошибка копирования в буфер обмена', 'error');
            }
            document.body.removeChild(textarea);
        }
        
        function showNotification(message, type = 'success') {
            const notification = document.createElement('div');
            notification.style.cssText = `
                position: fixed;
                top: 20px;
                right: 20px;
                padding: 16px 24px;
                border-radius: 12px;
                font-weight: 600;
                font-size: 14px;
                z-index: 10000;
                animation: slideIn 0.3s ease;
                box-shadow: 0 8px 32px rgba(0,0,0,0.3);
                backdrop-filter: blur(20px);
                -webkit-backdrop-filter: blur(20px);
            `;
            
            if (type === 'success') {
                notification.style.background = 'linear-gradient(135deg, rgba(0,255,136,0.2), rgba(0,245,255,0.2))';
                notification.style.border = '1px solid rgba(0,255,136,0.3)';
                notification.style.color = '#00ff88';
                notification.textContent = message;
            } else {
                notification.style.background = 'linear-gradient(135deg, rgba(255,65,108,0.2), rgba(255,75,43,0.2))';
                notification.style.border = '1px solid rgba(255,65,108,0.3)';
                notification.style.color = '#ff416c';
                notification.textContent = message;
            }
            
            document.body.appendChild(notification);
            
            setTimeout(() => {
                notification.style.animation = 'slideOut 0.3s ease';
                setTimeout(() => notification.remove(), 300);
            }, 3000);
        }
        
        loadData();
        setInterval(loadData, 30000);
    </script>
</body>
